<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Registro</title>
  <!-- RUTA DE CSS CORREGIDA SIN /public -->
  <link rel="stylesheet" href="/css/register.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="tabs">
      <a href="/login.html" class="tab-link">Ingresar</a>
      <a href="/register.html" class="tab-link active">Registrarse</a>
    </div>

    <form id="register-form">
      <h2>Crear Cuenta</h2>
      <input type="text" id="register-name" placeholder="Nombre completo" required />
      <input type="email" id="register-email" placeholder="Correo electrónico" required />
      <input type="password" id="register-password" placeholder="Contraseña" required />
      <button type="submit" class="btn-primary">Registrarse</button>
    </form>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
