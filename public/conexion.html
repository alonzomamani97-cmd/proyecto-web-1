<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión Segura - Proyecto Web</title>
    <link rel="stylesheet" href="/css/conexion.css">
</head>
<body class="auth-body">
    <div class="auth-card" id="connection-card">
        <!-- Elementos de Carga -->
        <div class="spinner"></div>
        <!-- Elemento de Éxito -->
        <div class="success-icon">✓</div>
        
        <h2 id="status-title">Creando conexión segura</h2>
        <p id="status-desc">Verificando en la base de datos de Neon...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const card = document.getElementById('connection-card');
            const title = document.getElementById('status-title');
            const desc = document.getElementById('status-desc');

            try {
                // Petición segura al backend para validar el perfil/sesión
                const response = await fetch('/api/users/profile');
                
                if (response.ok) {
                    // Activamos el estado de verificación exitosa en el CSS
                    card.classList.add('verified');
                    title.textContent = '¡Conexión verificada!';
                    desc.textContent = 'Acceso autorizado. Redirigiendo al panel...';

                    // Esperamos 1.2 segundos para que el usuario alcance a leer el éxito antes de entrar al index
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1200);
                } else {
                    alert('Sesión no autorizada o expirada.');
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                alert('Error de conexión con el servidor.');
                window.location.href = '/login.html';
            }
        });
    </script>
</body>
</html>
